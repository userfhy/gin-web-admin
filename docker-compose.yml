services:
  web:
    build:
      context: .
      dockerfile: docker/go/Dockerfile.prod
    image: gin-web-admin:prod
    restart: on-failure
    ports:
      - '8081:8081'
    volumes:
      - .:/code
    environment:
      - APP_ENV=live
    logging:
      driver: "json-file"
      options:
        max-size: "2G"
    working_dir: /code
